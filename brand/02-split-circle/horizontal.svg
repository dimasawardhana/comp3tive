<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60" role="img" aria-labelledby="c2-title c2-desc">
  <title id="c2-title">comp3tive</title>
  <desc id="c2-desc">Combination mark: a circle split into two balanced halves in amber and stone, with the wordmark comp3tive</desc>
  <defs>
    <style>
      .hl { fill: #C2410C; }
      .st { fill: #57534E; }
      .wm { font-family: 'Outfit', system-ui, sans-serif; font-size: 18px; font-weight: 600; fill: #1C1917; }
    </style>
  </defs>
  <!-- The split: a circle divided into two balanced halves (semicircular paths, no overlap) -->
  <path class="hl" d="M79,50 A20,20 0 0,0 79,10" transform="translate(-2,0)" />
  <path class="st" d="M79,10 A20,20 0 0,1 79,50" transform="translate(2,0)" />
  <text class="wm" x="109" y="41">comp3tive</text>
</svg>
