<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>comp3tive - match night</title>
    <!-- Type is self-hosted (src/fonts.css), the same way it is on the Landing
         Page — the app is served from a sub-path, and the font URLs are
         root-relative, so the same two files serve both documents. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/outfit-latin-6c18d579.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/familjen-grotesk-latin-414d5dfe.woff2"
    />
    <!-- The installable surface. The manifest's `start_url` is this document, so
         the launcher opens the tool and not the pitch; see public/manifest.webmanifest
         and Task 10's report for the field-by-field reasoning. `theme-color` is the
         OS chrome and is one static value, so it is the light theme's --surface:
         the paper `.topbar-wrap` paints, so the status strip and the app's own bar
         are one surface. iOS reads no manifest `theme_color` and rounds the icon to
         a squircle at full bleed, which is why both documents carry
         `apple-touch-icon` — the maskable tile, for its larger glyph rather than
         for its survival. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FAF8F5" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/maskable-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
