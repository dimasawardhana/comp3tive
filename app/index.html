    <!-- Type is self-hosted (src/fonts.css), the same way it is on the Landing
         Page — the app is served from a sub-path, and the font URLs are
         root-relative, so the same two files serve both documents. -->

      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/outfit-latin-6c18d579.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/familjen-grotesk-latin-414d5dfe.woff2"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
