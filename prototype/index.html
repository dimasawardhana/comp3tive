<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>comp3tive - match night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Familjen+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens: light (default) ---------- */
  :root{
    --surface:#F3F6F0; --surface-2:#FFFFFF; --hairline:#E3EBE2;
    --text:#0C2E21; --text-2:#18634A;
    --accent:#F2761E; --accent-ink:#0C2E21;
    --bib-a:#FFC400; --bib-b:#FF4F9A;
    --ok:#18634A;
    --chip-on:#18634A; --chip-on-text:#FFFFFF;
    --panel:#0E3325; --panel-text:#F3F6F0; --panel-card:rgba(243,246,240,.06);
    --track:rgba(243,246,240,.25); --tick:rgba(243,246,240,.4);
    --shadow:0 1px 2px rgba(12,46,33,.06), 0 8px 24px rgba(12,46,33,.08);
    --r-lg:20px; --r-md:14px; --r-sm:10px;
  }
  :root[data-theme="dark"]{
    --surface:#0E3325; --surface-2:#123F2F; --hairline:#1E4A39;
    --text:#F3F6F0; --text-2:#8FCEB0;
    --accent:#F2761E; --accent-ink:#0C2E21;
    --bib-a:#FFC400; --bib-b:#FF4F9A;
    --ok:#8FCEB0;
    --chip-on:#18634A; --chip-on-text:#FFFFFF;
    --panel:#17513E; --panel-text:#F3F6F0; --panel-card:rgba(243,246,240,.08);
    --track:rgba(243,246,240,.3); --tick:rgba(243,246,240,.45);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface:#0E3325; --surface-2:#123F2F; --hairline:#1E4A39;
      --text:#F3F6F0; --text-2:#8FCEB0;
      --accent:#F2761E; --accent-ink:#0C2E21;
      --bib-a:#FFC400; --bib-b:#FF4F9A;
      --ok:#8FCEB0;
      --chip-on:#18634A; --chip-on-text:#FFFFFF;
      --panel:#17513E; --panel-text:#F3F6F0; --panel-card:rgba(243,246,240,.08);
      --track:rgba(243,246,240,.3); --tick:rgba(243,246,240,.45);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
    }
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:"Familjen Grotesk", system-ui, sans-serif;
    background:var(--surface); color:var(--text); line-height:1.5;
    min-height:100vh; min-height:100dvh;
  }
  @media(min-width:720px){
    body{
      background:
        linear-gradient(var(--hairline),var(--hairline)) 0 0 / 100% 1px no-repeat,
        linear-gradient(var(--hairline),var(--hairline)) 0 100% / 100% 1px no-repeat,
        var(--surface);
      display:flex; align-items:stretch; justify-content:center;
    }
    .app{ width:480px; border-inline:1px solid var(--hairline); box-shadow:var(--shadow); }
  }
  .app{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; background:var(--surface); }

  /* ---------- top bar ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px 14px; }
  .wordmark{
    font-family:"Chakra Petch", sans-serif; font-weight:700; font-size:17px;
    letter-spacing:.04em; text-transform:uppercase; color:var(--text);
  }
  .wordmark .sq{ color:var(--accent); }
  .steplabel{
    font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-2);
  }

  /* ---------- screens ---------- */
  .screen{ display:flex; flex-direction:column; gap:18px; padding:6px 20px 24px; flex:1; }
  .screen[hidden]{ display:none; }
  h1{
    font-family:"Chakra Petch", sans-serif; font-weight:600; font-size:28px;
    line-height:1.1; letter-spacing:.01em; color:var(--text);
  }
  .lede{ font-size:16px; color:var(--text-2); max-width:34ch; }
  .sec{
    font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text); opacity:.65;
  }

  /* ---------- roster (squad) ---------- */
  .roster{ list-style:none; display:flex; flex-direction:column; gap:8px; }
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--r-md);
    padding:12px 14px; box-shadow:var(--shadow);
  }
  .row .who{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .row .name{ font-weight:600; font-size:15px; }
  .badges{ display:flex; gap:6px; flex-wrap:wrap; }
  .badge{
    font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    padding:2px 7px 3px; border-radius:999px; border:1px solid;
  }
  .badge .num{ font-family:"Chakra Petch", sans-serif; font-weight:600; font-size:11px; letter-spacing:0; }
  .badge.fut{ color:var(--text-2); border-color:var(--text-2); }
  .badge.ml{ color:var(--text); border-color:var(--text); opacity:.8; }
  .row .chev{ color:var(--text-2); font-weight:600; }

  .empty{
    border:1.5px dashed var(--hairline); border-radius:var(--r-lg);
    padding:28px 20px; text-align:left; background:var(--surface-2);
  }
  .empty .big{ font-family:"Chakra Petch", sans-serif; font-weight:600; font-size:18px; }
  .empty p{ margin-top:4px; color:var(--text-2); font-size:14px; }

  /* ---------- match ---------- */
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font-family:"Familjen Grotesk", sans-serif; font-size:15px; font-weight:500;
    padding:9px 16px; border-radius:999px; border:1.5px solid var(--hairline);
    background:var(--surface-2); color:var(--text); cursor:pointer;
  }
  .chip .str{ font-family:"Chakra Petch", sans-serif; font-weight:600; font-size:13px; color:var(--text-2); }
  .chip[aria-pressed="true"]{
    background:var(--chip-on); border-color:var(--chip-on); color:var(--chip-on-text);
  }
  .chip[aria-pressed="true"] .str{ color:inherit; }

  .games{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .game{
    text-align:left; background:var(--surface-2); border:1.5px solid var(--hairline);
    border-radius:var(--r-md); padding:14px; cursor:pointer;
    font-family:"Chakra Petch", sans-serif; font-weight:600; font-size:15px; color:var(--text);
  }
  .game .sub{
    display:block; font-family:"Familjen Grotesk", sans-serif; font-weight:500;
    font-size:12px; color:var(--text-2); margin-top:3px;
  }
  .game[aria-pressed="true"]{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }

  .stepper{ display:flex; align-items:center; gap:14px; }
  .stepper button{
    width:44px; height:44px; border-radius:var(--r-sm); border:1.5px solid var(--hairline);
    background:var(--surface-2); font-family:"Chakra Petch", sans-serif; font-weight:600; font-size:20px;
    color:var(--text); cursor:pointer;
  }
  .stepper .count{ font-family:"Chakra Petch", sans-serif; font-weight:700; font-size:24px; min-width:2ch; text-align:center; }
  .stepper .hint{ font-size:13px; color:var(--text-2); }

  /* ---------- buttons & bottom bar ---------- */
  .bar{
    margin-top:auto; display:flex; gap:10px;
    padding:14px 0 20px; position:sticky; bottom:0; background:var(--surface);
  }
  .btn{
    flex:1; font-family:"Familjen Grotesk", sans-serif; font-weight:600; font-size:16px;
    padding:15px 18px; border-radius:var(--r-md); border:none; cursor:pointer;
    white-space:nowrap;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-ghost{ flex:0 0 auto; background:transparent; border:1.5px solid var(--text); color:var(--text); }
  .btn-primary .count{ font-family:"Chakra Petch", sans-serif; font-weight:700; }
  .btn:active{ transform:translateY(1px) scale(.99); }

  :focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  /* ---------- split: turf panel, team cards, gap meter ---------- */
  .pitch{
    background:var(--panel); border-radius:var(--r-lg); padding:16px 14px 20px;
    display:flex; flex-direction:column; gap:14px; color:var(--panel-text);
  }
  .vs{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:stretch; }
  .team{ border-radius:var(--r-md); padding:12px 12px 10px; background:var(--panel-card); }
  .team .tname{
    font-family:"Chakra Petch", sans-serif; font-weight:700; font-size:13px;
    letter-spacing:.12em; text-transform:uppercase; padding:5px 10px; border-radius:999px;
    display:inline-block; color:var(--text); margin-bottom:10px;
  }
  .team.a .tname{ background:var(--bib-a); }
  .team.b .tname{ background:var(--bib-b); }
  .team ul{ list-style:none; display:flex; flex-direction:column; gap:7px; }
  .team li{ display:flex; justify-content:space-between; gap:8px; font-size:14px; font-weight:500; color:var(--panel-text); }
  .team li .role{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.65; }
  .team .avg{
    margin-top:10px; padding-top:9px; border-top:1px solid var(--track);
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.75;
  }
  .team .avg b{ font-family:"Chakra Petch", sans-serif; font-weight:700; font-size:20px; letter-spacing:0; opacity:1; color:var(--panel-text); }

  .mid{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:0 2px; }
  .mid .tag{ font-family:"Chakra Petch", sans-serif; font-weight:600; font-size:11px; letter-spacing:.08em; }

  /* split deal-in: the one orchestrated moment */
  .pitch .team, .pitch .mid{
    opacity:0; transform:translateY(10px);
    transition:opacity .4s ease, transform .4s cubic-bezier(.16,1,.3,1);
  }
  .pitch .team.b{ transition-delay:.07s; }
  .pitch .mid{ transition-delay:.14s; }
  .pitch.in .team, .pitch.in .mid{ opacity:1; transform:none; }

  /* the gap meter - a balance scale */
  .scale{ position:relative; height:64px; display:flex; align-items:center; justify-content:center; }
  .scale .track{
    position:absolute; left:8px; right:8px; top:50%; height:2px;
    background:var(--track); transform:translateY(-50%);
  }
  .scale .tick{
    position:absolute; top:50%; width:1px; height:8px; background:var(--tick);
    transform:translate(-50%,-50%);
  }
  .scale .tick.center{ height:14px; background:var(--panel-text); opacity:.7; }
  .scale .pivot{ position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%; background:var(--panel-text); transform:translate(-50%,-50%); z-index:2; }
  .needle{
    position:absolute; top:50%; left:50%; width:4px; height:26px;
    background:var(--accent); border-radius:2px; transform-origin:50% 100%;
    transform:translate(-50%,-100%) rotate(0deg);
    transition:transform .5s cubic-bezier(.34,1.3,.5,1);
  }
  .needle.balanced{ background:var(--ok); }
  .readout{ text-align:center; font-family:"Chakra Petch", sans-serif; font-weight:600; font-size:15px; letter-spacing:.02em; }
  .readout .fine{ font-family:"Familjen Grotesk", sans-serif; font-weight:500; font-size:13px; opacity:.8; }

  .flags{ display:flex; flex-direction:column; gap:8px; }
  .flag{
    font-size:14px; color:var(--text-2); background:var(--surface-2);
    border:1px solid var(--hairline); border-left:3px solid var(--accent);
    border-radius:var(--r-sm); padding:10px 14px;
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="wordmark">Team<span class="sq">&#9632;</span>Builder</div>
    <div class="steplabel" id="stepLabel">Squad</div>
  </header>

  <!-- ============ SQUAD ============ -->
  <section class="screen" id="screen-squad">
    <h1>Tonight's squad</h1>
    <p class="lede">Everyone you can call on. Add people once, split teams forever.</p>

    <ul class="roster" id="roster"></ul>

    <button class="btn btn-ghost">+ Add player</button>

    <div class="bar">
      <button class="btn btn-primary" data-next="match">Pick tonight's players</button>
    </div>
  </section>

  <!-- ============ MATCH ============ -->
  <section class="screen" id="screen-match" hidden>
    <h1>Who's here?</h1>
    <p class="lede">Tap everyone who showed up.</p>
    <div class="chips" id="pool"></div>

    <span class="sec">What are we playing?</span>
    <div class="games" id="games">
      <button class="game" data-game="futsal" aria-pressed="true">Futsal<span class="sub">5 v 5 + subs</span></button>
      <button class="game" data-game="mlbb" aria-pressed="false">Mobile Legends<span class="sub">5 v 5, roles covered</span></button>
    </div>

    <span class="sec">Teams</span>
    <div class="stepper">
      <button id="dec" aria-label="Fewer teams">&#8722;</button>
      <span class="count" id="teamCount">2</span>
      <button id="inc" aria-label="More teams">+</button>
      <span class="hint" id="sizeHint">5 v 5</span>
    </div>

    <div class="bar">
      <button class="btn btn-primary" data-next="split"><span id="splitCount">Split 0/10</span></button>
    </div>
  </section>

  <!-- ============ SPLIT ============ -->
  <section class="screen" id="screen-split" hidden>
    <h1>Tonight's teams</h1>

    <div class="pitch">
      <div class="vs">
        <div class="team a" id="teamA"></div>
        <div class="mid">
          <span class="tag">VS</span>
          <span class="tag" id="gapTag">0.6</span>
        </div>
        <div class="team b" id="teamB"></div>
      </div>

      <div class="scale" id="scale">
        <div class="track"></div>
        <div class="tick" style="left:25%"></div>
        <div class="tick" style="left:75%"></div>
        <div class="tick center" style="left:50%"></div>
        <div class="pivot"></div>
        <div class="needle" id="needle"></div>
      </div>

      <div class="readout" id="readout"></div>
    </div>

    <div class="flags" id="flags"></div>

    <div class="bar">
      <button class="btn btn-ghost" id="swapBtn">Swap</button>
      <button class="btn btn-primary" id="rerollBtn">Re-roll</button>
    </div>
  </section>

</div>

<script>
/* theme override for testing: ?theme=light|dark */
const themeParam = new URLSearchParams(location.search).get("theme");
if (themeParam) document.documentElement.dataset.theme = themeParam;

/* ---------- prototype data ---------- */
const players = [
  { name:"Budi",  fut:4.0, ml:3.7, role:"GK" },
  { name:"Andi",  fut:3.7, ml:4.2, role:"Def" },
  { name:"Cici",  fut:3.3, ml:3.0, role:"Def" },
  { name:"Dedi",  fut:3.9, ml:3.4, role:"Wing" },
  { name:"Eka",   fut:4.1, ml:3.9, role:"Pivot" },
  { name:"Fitri", fut:3.4, ml:4.1, role:"GK" },
  { name:"Gita",  fut:3.2, ml:3.5, role:"Def" },
  { name:"Hadi",  fut:3.3, ml:3.1, role:"Wing" },
  { name:"Intan", fut:3.1, ml:3.8, role:"Pivot" },
  { name:"Joko",  fut:4.0, ml:3.6, role:"Wing" },
];

let picked = new Set(players.map(p => p.name));
let teams = {
  a: ["Budi","Andi","Cici","Dedi","Eka"].map(n => ({ name:n, role:players.find(p=>p.name===n).role })),
  b: ["Fitri","Gita","Hadi","Intan","Joko"].map(n => ({ name:n, role:players.find(p=>p.name===n).role })),
};

const $ = s => document.querySelector(s);
const rosterEl = $("#roster"), poolEl = $("#pool");

/* roster rows */
players.forEach(p => {
  const li = document.createElement("li");
  li.className = "row";
  li.innerHTML = `
    <div class="who"><span class="name">${p.name}</span>
      <div class="badges">
        <span class="badge fut">Futsal <span class="num">${p.fut.toFixed(1)}</span></span>
        <span class="badge ml">MLBB <span class="num">${p.ml.toFixed(1)}</span></span>
      </div>
    </div><span class="chev">&#8250;</span>`;
  rosterEl.appendChild(li);
});

/* pool chips */
players.forEach(p => {
  const c = document.createElement("button");
  c.className = "chip";
  c.setAttribute("aria-pressed", "true");
  c.innerHTML = `${p.name} <span class="str">${p.fut.toFixed(1)}</span>`;
  c.onclick = () => {
    const on = c.getAttribute("aria-pressed") === "true";
    c.setAttribute("aria-pressed", String(!on));
    if (on) picked.delete(p.name); else picked.add(p.name);
    updateSplitCount();
  };
  poolEl.appendChild(c);
});

/* step navigation via hash: #squad | #match | #split */
function show(name){
  document.querySelectorAll(".screen").forEach(s => s.hidden = true);
  const el = $("#screen-" + name);
  el.hidden = false;
  const labels = { squad:"Squad", match:"Match", split:"Split" };
  $("#stepLabel").textContent = labels[name];
  if (name === "split"){
    const pitch = document.querySelector(".pitch");
    pitch.classList.remove("in");
    requestAnimationFrame(() => requestAnimationFrame(() => pitch.classList.add("in")));
    renderSplit();
  }
  window.scrollTo({ top:0 });
}
function route(){
  const h = location.hash.replace("#", "");
  if (["squad","match","split"].includes(h)) show(h);
}
window.addEventListener("hashchange", route);
document.querySelectorAll("[data-next]").forEach(b =>
  b.addEventListener("click", () => { location.hash = b.dataset.next; }));
route();
$("#swapBtn").onclick = swap;
$("#rerollBtn").onclick = reroll;

/* match screen plumbing */
const dec = $("#dec"), inc = $("#inc");
let teamCount = 2;
function updateSplitCount(){
  $("#splitCount").textContent = `Split ${picked.size}/${players.length}`;
}
function updateSizeHint(){
  const game = document.querySelector('.game[aria-pressed="true"]').dataset.game;
  const per = Math.floor(players.length / teamCount);
  $("#sizeHint").textContent = game === "futsal"
    ? `${Math.max(5,per)} per team, subs ok`
    : `${Math.min(5,per)} per team, roles covered`;
}
dec.onclick = () => { teamCount = Math.max(2, teamCount - 1); $("#teamCount").textContent = teamCount; updateSizeHint(); };
inc.onclick = () => { teamCount = Math.min(5, teamCount + 1); $("#teamCount").textContent = teamCount; updateSizeHint(); };
document.querySelectorAll(".game").forEach(g =>
  g.onclick = () => { document.querySelectorAll(".game").forEach(x => x.setAttribute("aria-pressed", "false")); g.setAttribute("aria-pressed","true"); updateSizeHint(); });
updateSplitCount(); updateSizeHint();

/* ---------- split + the gap meter ---------- */
function str(p){ return players.find(x => x.name === p.name).fut; }
function avg(names){ return names.reduce((s,m) => s + str(m), 0) / names.length; }
function roleFlags(){
  const req = ["GK","Def","Wing","Pivot"];
  const out = [];
  for (const [label, team] of [["yellow", teams.a], ["pink", teams.b]]){
    const have = team.map(m => m.role);
    for (const r of req){
      if (!have.includes(r)){
        const best = [...team].sort((x,y) => str(y) - str(x))[0].name;
        out.push(`No ${r.toLowerCase()} on ${label}. ${best} is covering.`);
      }
    }
  }
  return out;
}
function renderSplit(){
  const A = avg(teams.a), B = avg(teams.b);
  const gap = Math.abs(A - B);
  const imbalanced = gap > 0.1;

  const card = (t) => `
    <span class="tname">Team ${t.toUpperCase()}</span>
    <ul>${teams[t].map(m => `<li><span>${m.name}</span><span class="role">${m.role}</span></li>`).join("")}</ul>
    <div class="avg"><span>Avg strength</span><b>${avg(teams[t]).toFixed(1)}</b></div>`;
  $("#teamA").innerHTML = card("a");
  $("#teamB").innerHTML = card("b");

  const needle = $("#needle");
  needle.classList.toggle("balanced", !imbalanced);
  const deg = imbalanced ? (A > B ? -1 : 1) * Math.min(28, gap * 45) : 0;
  needle.style.transform = `translate(-50%,-100%) rotate(${deg}deg)`;

  $("#gapTag").textContent = imbalanced ? gap.toFixed(1) : "OK";
  $("#readout").innerHTML = imbalanced
    ? `${(A>B?"Team A":"Team B")} is ${gap.toFixed(1)} ahead. <span class="fine">Swap to even it up.</span>`
    : `Dead even. <span class="fine">Fair game.</span>`;

  const calls = [...roleFlags(), imbalanced
    ? `${A>B?"Yellow":"Pink"} is ${gap.toFixed(1)} ahead. Swap someone over.`
    : "All roles covered. Fair game, have fun."];
  $("#flags").innerHTML = calls.map(c => `<div class="flag">${c}</div>`).join("");
}

/* swap: move Team A's pivot for Team B's wing (Eka <-> Joko) */
function swap(){
  const ia = teams.a.findIndex(m => m.role === "Pivot");
  const ib = teams.b.findIndex(m => m.role === "Wing");
  if (ia < 0 || ib < 0) return;
  const tmp = teams.a[ia]; teams.a[ia] = teams.b[ib]; teams.b[ib] = tmp;
  renderSplit();
}
/* re-roll: redistribute to balance averages */
function reroll(){
  const pool = [...teams.a, ...teams.b].sort((x,y) => str(y) - str(x));
  teams.a = pool.filter((_,i) => i % 2 === 0).map((m,i) => ({ name:m.name, role:["GK","Def","Wing","Pivot"][i % 4] }));
  teams.b = pool.filter((_,i) => i % 2 === 1).map((m,i) => ({ name:m.name, role:["GK","Def","Wing","Pivot"][i % 4] }));
  renderSplit();
}
</script>
</body>
</html>
