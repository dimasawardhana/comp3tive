<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>comp3tive — page not found</title>
    <!-- Self-hosted type, as on both real documents. This file is served for
         unmatched paths, so the preloads are the only thing on it that can
         404 — and they resolve root-relative like the rest of the app. They
         are worth keeping: a 404 in the app's own type is a small real
         improvement, and two hints on a page nobody waits for cost nothing. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/outfit-latin-6c18d579.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/familjen-grotesk-latin-414d5dfe.woff2"
    />
    <style>
      /* Self-contained by necessity: this file is served for unmatched paths by
         Cloudflare's `not_found_handling: "404-page"`, and public/ is copied to the
         dist root verbatim, so it cannot reference a hashed bundle. The token values
         below are a copy of src/tokens.css — if a token changes there, change it here. */
      /*
         …and that is also why the two latin faces are copied in here, for the
         same reason and with the same contract. This document has no stylesheet,
         so it cannot reach `src/fonts.css`: a `@font-face` in a bundle it never
         loads is not a face, and the two `preload` hints above it are earning
         nothing. Not the latin-ext or the vietnamese subsets — nothing on this
         page carries a codepoint they cover, and a `unicode-range` nothing here
         can match is weight on the wire. `src/fonts.test.ts` fails if this copy
         is edited without `src/fonts.css`.
       */
      @font-face {
        font-family: "Outfit";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/outfit-latin-6c18d579.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Familjen Grotesk";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/familjen-grotesk-latin-414d5dfe.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --surface: #faf8f5;
        --text: #1c1917;
        --text-2: #57534e;
        --accent: #c2410c;
        --accent-ink: #ffffff;
        --hairline: #e7e3dc;
        --r-md: 12px;
        /* The type stack, copied from src/tokens.css with the rest of them.
           This document is reached when a URL is wrong, which is also when a
           font is least likely to be in cache, so the fall-back half of each
           list is doing more work here than anywhere else. */
        --font-display: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-body: "Familjen Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      :root[data-theme="dark"] {
        --surface: #1c1917;
        --text: #faf8f5;
        --text-2: #a8a29e;
        --accent: #ea580c;
        --accent-ink: #10131a;
        --hairline: #332f2a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --surface: #1c1917;
          --text: #faf8f5;
          --text-2: #a8a29e;
          --accent: #ea580c;
          --accent-ink: #10131a;
          --hairline: #332f2a;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font-body);
        background: var(--surface);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 480px;
        text-align: center;
      }
      .wordmark {
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 700;
        color: var(--text-2);
        padding-bottom: 16px;
        border-bottom: 1px solid var(--hairline);
        margin-bottom: 32px;
      }
      .kicker {
        display: inline-block;
        font-family: var(--font-display);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 12px;
      }
      .kicker::before {
        content: "▸ ";
      }
      h1 {
        font-family: var(--font-display);
        font-size: clamp(28px, 7vw, 40px);
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      p {
        color: var(--text-2);
        font-size: 16px;
        margin-top: 16px;
        text-wrap: pretty;
      }
      .cta {
        display: inline-block;
        font-family: var(--font-display);
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 14px 28px;
        border-radius: var(--r-md);
        min-height: 44px;
        margin-top: 28px;
      }
      .cta:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark">comp3tive</p>
      <p class="kicker">Page not found</p>
      <h1>This page doesn&rsquo;t exist.</h1>
      <p>
        Your data is untouched — it lives in this browser, not on a server. Only the address was
        wrong.
      </p>
      <a class="cta" href="/">Back to comp3tive</a>
    </main>
  </body>
</html>
