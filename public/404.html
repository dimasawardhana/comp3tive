<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>comp3tive — page not found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Familjen+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Self-contained by necessity: this file is served for unmatched paths by
         Cloudflare's `not_found_handling: "404-page"`, and public/ is copied to the
         dist root verbatim, so it cannot reference a hashed bundle. The token values
         below are a copy of src/tokens.css — if a token changes there, change it here. */
      :root {
        --surface: #faf8f5;
        --text: #1c1917;
        --text-2: #57534e;
        --accent: #c2410c;
        --accent-ink: #ffffff;
        --hairline: #e7e3dc;
        --r-md: 12px;
      }
      :root[data-theme="dark"] {
        --surface: #1c1917;
        --text: #faf8f5;
        --text-2: #a8a29e;
        --accent: #ea580c;
        --accent-ink: #10131a;
        --hairline: #332f2a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --surface: #1c1917;
          --text: #faf8f5;
          --text-2: #a8a29e;
          --accent: #ea580c;
          --accent-ink: #10131a;
          --hairline: #332f2a;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Familjen Grotesk", system-ui, sans-serif;
        background: var(--surface);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 480px;
        text-align: center;
      }
      .wordmark {
        font-family: "Outfit", sans-serif;
        font-size: 15px;
        font-weight: 700;
        color: var(--text-2);
        padding-bottom: 16px;
        border-bottom: 1px solid var(--hairline);
        margin-bottom: 32px;
      }
      .kicker {
        display: inline-block;
        font-family: "Outfit", sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 12px;
      }
      .kicker::before {
        content: "▸ ";
      }
      h1 {
        font-family: "Outfit", sans-serif;
        font-size: clamp(28px, 7vw, 40px);
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      p {
        color: var(--text-2);
        font-size: 16px;
        margin-top: 16px;
        text-wrap: pretty;
      }
      .cta {
        display: inline-block;
        font-family: "Outfit", sans-serif;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 14px 28px;
        border-radius: var(--r-md);
        min-height: 44px;
        margin-top: 28px;
      }
      .cta:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark">comp3tive</p>
      <p class="kicker">Page not found</p>
      <h1>This page doesn&rsquo;t exist.</h1>
      <p>
        Your data is untouched — it lives in this browser, not on a server. Only the address was
        wrong.
      </p>
      <a class="cta" href="/">Back to comp3tive</a>
    </main>
  </body>
</html>
